---
/displays:
  get:
    x-mojo-to: Displays#list
    operationId: listDisplays
    tags:
      - displays
    summary: List displays
    produces:
      - application/json
    parameters:
      - name: display_name
        in: query
        description: Case insensitive search on display name
        required: false
        type: string
      - name: enabled
        in: query
        description: Filter by enabled status
        required: false
        type: boolean
      - name: display_home_branch
        in: query
        description: Filter by display home branch
        required: false
        type: string
      - name: display_holding_branch
        in: query
        description: Filter by display holding branch
        required: false
        type: string
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - display_items
            - display_library
            - home_library
            - holding_library
            - item_type
            - +strings
        collectionFormat: csv
    responses:
      "200":
        description: A list of displays
        schema:
          type: array
          items:
            $ref: "../swagger.yaml#/definitions/display"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        displays: view_displays
  post:
    x-mojo-to: Displays#add
    operationId: addDisplay
    tags:
      - displays
    summary: Add display
    parameters:
      - name: body
        in: body
        description: A JSON object containing information about the new display
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/display"
    produces:
      - application/json
    responses:
      "201":
        description: Display added
        schema:
          $ref: "../swagger.yaml#/definitions/display"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        displays: add_displays
"/displays/{display_id}":
  get:
    x-mojo-to: Displays#get
    operationId: getDisplay
    tags:
      - displays
    summary: Get display
    parameters:
      - $ref: "../swagger.yaml#/parameters/display_id_pp"
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - display_items
            - display_library
            - home_library
            - holding_library
            - item_type
            - +strings
        collectionFormat: csv
    produces:
      - application/json
    responses:
      "200":
        description: A display
        schema:
          $ref: "../swagger.yaml#/definitions/display"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Display not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        displays: view_displays
  put:
    x-mojo-to: Displays#update
    operationId: updateDisplay
    tags:
      - displays
    summary: Update display
    parameters:
      - $ref: "../swagger.yaml#/parameters/display_id_pp"
      - name: body
        in: body
        description: A display object
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/display"
    produces:
      - application/json
    responses:
      "200":
        description: A display
        schema:
          $ref: "../swagger.yaml#/definitions/display"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Display not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        displays: edit_displays
  delete:
    x-mojo-to: Displays#delete
    operationId: deleteDisplay
    tags:
      - displays
    summary: Delete display
    parameters:
      - $ref: "../swagger.yaml#/parameters/display_id_pp"
    produces:
      - application/json
    responses:
      "204":
        description: Display deleted
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Display not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        displays: delete_displays
