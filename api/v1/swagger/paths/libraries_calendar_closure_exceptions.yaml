---
"/libraries/{library_id}/calendar/closure_exceptions":
  post:
    x-mojo-to: Libraries::Calendar::ClosureExceptions#add
    operationId: addClosureException
    tags:
      - libraries
    summary: Add a closure exception (open override)
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            date:
              type: string
              format: date
              description: Date (ISO 8601)
            title:
              type: string
            description:
              type: string
          required:
            - date
          additionalProperties: false
    produces:
      - application/json
    responses:
      "201":
        description: Exception created
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Library not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. Possible `error_code` attribute values:

          * `duplicate`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
