---
"/libraries/{library_id}/calendar/repeating_closures":
  post:
    x-mojo-to: Libraries::Calendar::RepeatingClosures#add
    operationId: addRepeatingClosure
    tags:
      - libraries
    summary: Add a repeating annual closure
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            day:
              type: integer
              description: Day of month
            month:
              type: integer
              description: Month
            title:
              type: string
            description:
              type: string
          required:
            - day
            - month
          additionalProperties: false
    produces:
      - application/json
    responses:
      "201":
        description: Closure created
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Library not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. Possible `error_code` attribute values:

          * `duplicate`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
"/libraries/{library_id}/calendar/repeating_closures/{repeating_closure_id}":
  get:
    x-mojo-to: Libraries::Calendar::RepeatingClosures#get
    operationId: getRepeatingClosure
    tags:
      - libraries
    summary: Get a repeating closure
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: repeating_closure_id
        in: path
        required: true
        type: integer
    produces:
      - application/json
    responses:
      "200":
        description: A repeating closure
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        catalogue: "1"
  put:
    x-mojo-to: Libraries::Calendar::RepeatingClosures#update
    operationId: updateRepeatingClosure
    tags:
      - libraries
    summary: Update a repeating closure
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: repeating_closure_id
        in: path
        required: true
        type: integer
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
          additionalProperties: false
    produces:
      - application/json
    responses:
      "200":
        description: Updated closure
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
  delete:
    x-mojo-to: Libraries::Calendar::RepeatingClosures#delete
    operationId: deleteRepeatingClosure
    tags:
      - libraries
    summary: Delete a repeating closure
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: repeating_closure_id
        in: path
        required: true
        type: integer
    produces:
      - application/json
    responses:
      "204":
        description: Deleted
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
