---
/acquisitions/accessions:
  get:
    x-mojo-to: Acquisitions::Invoicing::Accessions#list
    operationId: listAccessions
    description: Retrieves the accessions for the acquisition module
    tags:
      - listAccessions
    produces:
      - application/json
    parameters:
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
