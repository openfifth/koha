---
"/checkins/availability":
  get:
    x-mojo-to: Checkins#get_availability
    operationId: availabilityCheckins
    tags:
      - checkins
    summary: Get checkin availability
    parameters:
      - name: item_id
        in: query
        description: Internal item identifier
        required: true
        type: integer
      - name: library_id
        in: query
        description: Internal library identifier
        required: false
        type: string
    produces:
      - application/json
    responses:
      "200":
        description: Checkin availability information
        headers:
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin_availability"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
/checkins:
  post:
    x-mojo-to: Checkins#add
    operationId: addCheckin
    tags:
      - checkins
    summary: Check in (return) an item
    description: |
      Exactly one of `item_id` or `external_id` must be provided.
      Passing both simultaneously is not allowed.
    parameters:
      - name: body
        in: body
        description: A JSON object containing checkin information
        required: true
        schema:
          type: object
          properties:
            item_id:
              type: integer
              description: Internal item identifier. Mutually exclusive with external_id.
            external_id:
              type: string
              description: Item barcode. Mutually exclusive with item_id.
            library_id:
              type: string
              description: Library where the return takes place
            exempt_fine:
              type: boolean
              description: Exempt fines on this return
            return_date:
              type: string
              description: Override return date (ISO 8601 datetime)
            dropbox_mode:
              type: boolean
              description: Use book drop mode (calculate return date as last open day)
            verified_bundle_barcodes:
              type:
                - array
                - "null"
              items:
                type: string
              description: Barcodes of items verified as present in the bundle (only for bundle items)
          additionalProperties: false
      - name: confirmation
        in: query
        description: A JWT confirmation token
        required: false
        type: string
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - checkout
            - claim
            - credits
            - debits
            - desk
            - hold
            - hold.patron
            - item
            - item.biblio
            - library
            - recall
            - recall.patron
            - restriction
            - transfer
            - user
        collectionFormat: csv
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "200":
        description: Item checked in
        headers:
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `missing_item_identifier` - Neither item_id nor external_id provided
          * `mutually_exclusive_parameters` - Both item_id and external_id provided
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Checkin blocked or forbidden. Possible `error_code` attribute values:

          * `checkin_blocked` - Item has blockers preventing checkin.
            Possible keys in the `blockers` object:
            - `blocked_withdrawn` - Item is withdrawn (BlockReturnOfWithdrawnItems enabled)
            - `blocked_lost` - Item is lost (BlockReturnOfLostItems enabled)
            - `wrong_branch` - Item cannot be returned at this branch (AllowReturnToBranch policy).
              Value is an object with `wrong_branch` and `right_branch` keys.
          * `no_permission_for_exempt_fine` - updatecharges.writeoff permission required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "412":
        description: |
          Confirmation required. Possible `error_code` attribute values:

          * `confirmation_required` - Staff must confirm before checkin proceeds.
            Possible keys in the `confirms` object:
            - `item_parts` - Item has accompanying materials (CircConfirmItemParts enabled).
              Value is the materials description string.
            Response includes a `confirmation_token` JWT to pass back on retry.
        schema:
          $ref: "../swagger.yaml#/definitions/checkin_availability"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/checkins/{checkin_id}/hold_confirmation":
  post:
    x-mojo-to: Checkins#hold_confirmation
    operationId: confirmCheckinHold
    tags:
      - checkins
    summary: Confirm the hold found during checkin
    description: |
      Sets the trapped hold to waiting (or initiates transfer to pickup
      branch if different from checkin library).
    parameters:
      - $ref: "#/parameters/checkin_id_pp"
      - $ref: "#/parameters/checkin_embed_header"
    produces:
      - application/json
    responses:
      "201":
        description: Hold confirmed
        headers:
          Location:
            description: URI of the updated checkin resource
            type: string
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: No hold associated with this checkin
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Checkin not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal server error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/checkins/{checkin_id}/hold_cancellation":
  post:
    x-mojo-to: Checkins#hold_cancellation
    operationId: cancelCheckinHold
    tags:
      - checkins
    summary: Cancel the hold found during checkin
    parameters:
      - $ref: "#/parameters/checkin_id_pp"
      - name: body
        in: body
        required: false
        schema:
          type: object
          properties:
            reason:
              type:
                - string
                - "null"
              description: Cancellation reason (authorised value from HOLD_CANCELLATION)
          additionalProperties: false
      - $ref: "#/parameters/checkin_embed_header"
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "201":
        description: Hold cancelled
        headers:
          Location:
            description: URI of the updated checkin resource
            type: string
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: No hold associated with this checkin
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Checkin not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal server error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
