"/checkins/{checkin_id}/recall_confirmation":
  post:
    x-mojo-to: Checkins#recall_confirmation
    operationId: confirmCheckinRecall
    tags:
      - checkins
    summary: Confirm the recall (set waiting or start transfer)
    parameters:
      - $ref: "#/parameters/checkin_id_pp"
      - $ref: "#/parameters/checkin_embed_header"
    produces:
