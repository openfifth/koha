---
"/checkins/availability":
  get:
    x-mojo-to: Checkins#get_availability
    operationId: availabilityCheckins
    tags:
      - checkins
    summary: Get checkin availability
    parameters:
      - name: item_id
        in: query
        description: Internal item identifier
        required: true
        type: integer
      - name: library_id
        in: query
        description: Internal library identifier
        required: false
        type: string
    produces:
      - application/json
    responses:
      "200":
        description: Checkin availability information
        headers:
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin_availability"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
/checkins:
  post:
    x-mojo-to: Checkins#add
    operationId: addCheckin
    tags:
      - checkins
    summary: Check in (return) an item
    description: |
      Exactly one of `item_id` or `external_id` must be provided.
      Passing both simultaneously is not allowed.
    parameters:
      - name: body
        in: body
        description: A JSON object containing checkin information
        required: true
        schema:
          type: object
          properties:
            item_id:
              type: integer
              description: Internal item identifier. Mutually exclusive with external_id.
            external_id:
              type: string
              description: Item barcode. Mutually exclusive with item_id.
            library_id:
              type: string
              description: Library where the return takes place
            exempt_fine:
              type: boolean
              description: Exempt fines on this return
            return_date:
              type: string
              description: Override return date (ISO 8601 datetime)
            dropbox_mode:
              type: boolean
              description: Use book drop mode (calculate return date as last open day)
          additionalProperties: false
      - name: confirmation
        in: query
        description: A JWT confirmation token
        required: false
        type: string
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - checkout
            - claim
            - credits
            - debits
            - desk
            - hold
            - item
            - item.biblio
            - library
            - recall
            - restriction
            - transfer
            - user
        collectionFormat: csv
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "200":
        description: Item checked in
        headers:
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `missing_item_identifier` - Neither item_id nor external_id provided
          * `mutually_exclusive_parameters` - Both item_id and external_id provided
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Checkin blocked or forbidden. Possible `error_code` attribute values:

          * `checkin_blocked` - Item has blockers (withdrawn, lost, wrong branch). See `blockers` object.
          * `no_permission_for_exempt_fine` - updatecharges.writeoff permission required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "412":
        description: |
          Confirmation required. Possible `error_code` attribute values:

          * `confirmation_required`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/checkins/{checkin_id}":
  put:
    x-mojo-to: Checkins#update
    operationId: updateCheckin
    tags:
      - checkins
    summary: Resolve post-checkin decisions
    description: |
      Resolves pending decisions on a checkin that requires staff action.

      After POST /checkins creates the checkin record and returns messages
      indicating a hold was found, a transfer is needed, or a recall was
      trapped, this endpoint lets the client submit the staff decision.

      Supported actions:

      * `confirm_hold` — Set the hold to waiting (or initiate transfer to
        pickup branch if different from current library)
      * `cancel_hold` — Cancel the trapped hold (with optional reason)
      * `confirm_transfer` — Confirm and set the transfer in transit
      * `cancel_transfer` — Cancel the pending transfer
      * `confirm_recall` — Set the recall to waiting (or initiate transfer)
      * `ignore` — Acknowledge the message without taking action
    parameters:
      - name: checkin_id
        in: path
        description: Internal checkin identifier
        required: true
        type: integer
      - name: body
        in: body
        description: A JSON object containing the staff decision
        required: true
        schema:
          type: object
          properties:
            action:
              type: string
              description: The action to take
              enum:
                - confirm_hold
                - cancel_hold
                - confirm_transfer
                - cancel_transfer
                - confirm_recall
                - ignore
            cancel_reason:
              type:
                - string
                - "null"
              description: Reason for cancelling a hold (authorised value from HOLD_CANCELLATION)
            print_slip:
              type: boolean
              description: Whether to include slip data in the response
          required:
            - action
          additionalProperties: false
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - checkout
            - claim
            - credits
            - debits
            - desk
            - hold
            - hold.patron
            - item
            - item.biblio
            - library
            - recall
            - recall.patron
            - restriction
            - transfer
            - transfer.to_library
            - user
        collectionFormat: csv
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "200":
        description: Decision applied successfully
        headers:
          X-Koha-Module-Policy:
            description: JWT containing current module policy capabilities
            type: string
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `invalid_action` — The action is not valid for this checkin's state
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Checkin not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. Possible `error_code` attribute values:

          * `already_resolved` — This checkin has already been resolved
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
