    name: checkin_id
    in: path
    description: Internal checkin identifier
    required: true
    type: integer
  checkin_embed_header:
    name: x-koha-embed
    in: header
    required: false
    description: Embed list sent as a request header
    type: array
    items:
      type: string
      enum:
        - checkout
        - claim
        - credits
        - debits
        - desk
        - hold
        - hold.patron
        - item
        - item.biblio
        - library
        - recall
        - recall.patron
        - restriction
        - transfer
        - transfer.to_library
        - user
    collectionFormat: csv
