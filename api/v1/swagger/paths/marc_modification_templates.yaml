---
/marc_modification_templates:
  get:
    x-mojo-to: MarcModificationTemplates#list
    operationId: listMarcModificationTemplates
    tags:
      - marc_modification_templates
    summary: List MARC modification templates
    parameters:
      - name: name
        in: query
        description: Search on the template's name
        required: false
        type: string
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "200":
        description: A list of MARC modification templates
        schema:
          $ref: "../swagger.yaml#/definitions/marc_modification_templates"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools:
          - stage_marc_import
          - manage_staged_marc
          - marc_modification_templates
          - records_batchmod
"/marc_modification_templates/{marc_modification_template_id}":
  get:
    x-mojo-to: MarcModificationTemplates#get
    operationId: getMarcModificationTemplate
    tags:
      - marc_modification_templates
    summary: Get a MARC modification template
    parameters:
      - $ref: "../swagger.yaml#/parameters/marc_modification_template_id_pp"
    produces:
      - application/json
    responses:
      "200":
        description: A MARC modification template
        schema:
          $ref: "../swagger.yaml#/definitions/marc_modification_template"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: MARC modification template not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools:
          - stage_marc_import
          - manage_staged_marc
          - marc_modification_templates
          - records_batchmod
