---
"/acquisitions/vendors/{vendor_id}/allocations":
  get:
    x-mojo-to: Acquisitions::Vendor::Allocations#list
    operationId: listVendorAllocations
    tags:
      - vendors
    summary: List vendor allocations
    produces:
      - application/json
    parameters:
      - $ref: "../swagger.yaml#/parameters/vendor_id_pp"
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    responses:
      "200":
        description: A list of vendor allocations
        schema:
          type: array
          items:
            $ref: "../swagger.yaml#/definitions/vendor_allocation"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Resource not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |-
          Internal server error. Possible `error_code` attribute values:
          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        acquisition: budget_manage
  post:
    x-mojo-to: Acquisitions::Vendor::Allocations#add
    operationId: addVendorAllocation
    tags:
      - vendors
    summary: Add a vendor allocation
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - $ref: "../swagger.yaml#/parameters/vendor_id_pp"
      - description: A JSON object containing information about the new allocation
        in: body
        name: body
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/vendor_allocation"
    responses:
      "201":
        description: Allocation added
        schema:
          $ref: "../swagger.yaml#/definitions/vendor_allocation"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Resource not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: Conflict (allocation already exists for this vendor + period)
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |-
          Internal server error. Possible `error_code` attribute values:
          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        acquisition: budget_manage

