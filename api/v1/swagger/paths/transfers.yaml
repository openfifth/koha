---
"/transfers/{transfer_id}/cancellation":
  post:
    x-mojo-to: Transfers#cancel
    operationId: cancelTransfer
    tags:
      - transfers
    summary: Cancel a transfer
    description: |
      Cancels the given transfer. If the item has an associated in-transit
      recall, the recall's transfer is reverted as well.
    parameters:
      - name: transfer_id
        in: path
        required: true
        description: Internal transfer identifier
        type: integer
      - name: body
        in: body
        required: false
        description: A JSON object containing optional cancellation information
        schema:
          type: object
          properties:
            cancellation_reason:
              type: string
              description: |
                Reason for cancelling the transfer. Defaults to `Manual` when
                not supplied.
          additionalProperties: false
    produces:
      - application/json
    responses:
      "200":
        description: Transfer cancelled
        schema:
          $ref: "../swagger.yaml#/definitions/transfer"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Transfer not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. The transfer cannot be cancelled. Possible `error_code`
          attribute values:

          * `already_arrived` - The transfer has already arrived.
          * `already_cancelled` - The transfer has already been cancelled.
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: Internal server error
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
