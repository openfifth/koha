---
/plugins:
  get:
    x-mojo-to: Plugins#list
    operationId: listPlugins
    tags:
      - plugins
    summary: List installed plugins
    produces:
      - application/json
    parameters:
      - description: Restrict the list to plugins with this capability
        in: query
        name: capability
        required: false
        type: string
        enum:
          - configure
          - tool
          - report
          - admin
    responses:
      "200":
        description: A list of installed plugins
        schema:
          type: array
          items:
            type: object
            properties:
              class:
                type: string
              name:
                type: string
              description:
                type: string
              author:
                type: string
              version:
                type: string
              minimum_version:
                type: [string, "null"]
              maximum_version:
                type: [string, "null"]
              date_updated:
                type: [string, "null"]
              is_enabled:
                type: boolean
              can_configure:
                type: boolean
              can_tool:
                type: boolean
              can_report:
                type: boolean
              can_admin:
                type: boolean
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: "*"
  post:
    x-mojo-to: Plugins#add
    operationId: addPlugin
    tags:
      - plugins
    summary: Add and install a plugin
    produces:
      - application/json
    parameters:
      - name: body
        in: body
        schema:
          type: object
          properties:
            kpz_url:
              type: string
              description: URL to the plugin kpz file
    responses:
      "200":
        description: Successful plugin install
        schema:
          type: object
          properties:
            success:
              type: string
          additionalProperties: false
      "201":
        description: Plugin added
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `missing_kpz_url`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: 1
"/plugins/config":
  get:
    x-mojo-to: Plugins#config
    operationId: getPluginsConfig
    tags:
      - plugins
    summary: Get the plugins config
    produces:
      - application/json
    responses:
      "200":
        description: The plugins config
        schema:
          type: object
          properties:
            permissions:
              type: object
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: "*"