---
/plugins:
  get:
    x-mojo-to: Plugins#list
    operationId: listPlugins
    tags:
      - plugins
    summary: List installed plugins
    produces:
      - application/json
    parameters:
      - description: Restrict the list to plugins with this capability
        in: query
        name: capability
        required: false
        type: string
        enum:
          - configure
          - tool
          - report
          - admin
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    responses:
      "200":
        description: A list of installed plugins
        schema:
          type: array
          items:
            type: object
            properties:
              class:
                type: string
              name:
                type: string
              description:
                type: string
              author:
                type: string
              version:
                type: string
              minimum_version:
                type: [string, "null"]
              maximum_version:
                type: [string, "null"]
              date_updated:
                type: [string, "null"]
              is_enabled:
                type: boolean
              can_configure:
                type: boolean
              can_tool:
                type: boolean
              can_report:
                type: boolean
              can_admin:
                type: boolean
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: "*"
  post:
    x-mojo-to: Plugins#add
    operationId: addPlugin
    tags:
      - plugins
    summary: Add and install a plugin
    produces:
      - application/json
    parameters:
      - name: body
        in: body
        schema:
          type: object
          properties:
            kpz_url:
              type: string
              description: URL to the plugin kpz file
            confirm_unsigned:
              type: boolean
              description: Set true to proceed with an unsigned/unverified plugin after the caller has confirmed with the user
    responses:
      "200":
        description: Successful plugin install
        schema:
          type: object
          properties:
            success:
              type: string
          additionalProperties: false
      "201":
        description: Plugin added
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `missing_kpz_url`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Access forbidden. Possible `error` attribute values:

          * `RESTRICTED`
          * `SIGNATUREMISMATCH`
          * `UNSIGNED`
          * `UNSIGNEDCONFIRMREQUIRED`
          * `BELOWMINIMUMLEVEL`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: 1
"/plugins/config":
  get:
    x-mojo-to: Plugins#config
    operationId: getPluginsConfig
    tags:
      - plugins
    summary: Get the plugins config
    produces:
      - application/json
    responses:
      "200":
        description: The plugins config
        schema:
          type: object
          properties:
            permissions:
              type: object
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: "*"
"/plugins/{plugin_class}":
  put:
    x-mojo-to: Plugins#update
    operationId: updatePlugin
    tags:
      - plugins
    summary: Enable or disable a plugin
    produces:
      - application/json
    parameters:
      - description: Plugin class name
        in: path
        name: plugin_class
        required: true
        type: string
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            is_enabled:
              type: boolean
    responses:
      "200":
        description: Plugin updated
        schema:
          type: object
          properties:
            success:
              type: string
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: manage
  delete:
    x-mojo-to: Plugins#delete
    operationId: deletePlugin
    tags:
      - plugins
    summary: Uninstall a plugin
    produces:
      - application/json
    parameters:
      - description: Plugin class name
        in: path
        name: plugin_class
        required: true
        type: string
    responses:
      "204":
        description: Plugin uninstalled
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: manage
"/plugins/upload":
  post:
    x-mojo-to: Plugins#upload
    operationId: uploadPlugin
    tags:
      - plugins
    summary: Upload and install a plugin from a local file
    consumes:
      - multipart/form-data
    produces:
      - application/json
    parameters:
      - name: file
        in: formData
        required: true
        type: file
        description: The .kpz plugin file
      - name: confirm_unsigned
        in: formData
        required: false
        type: boolean
        description: Set true to proceed with an unsigned/unverified plugin after the caller has confirmed with the user
    responses:
      "201":
        description: Plugin installed
        schema:
          type: object
          properties:
            success:
              type: string
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Access forbidden. Possible `error` attribute values:

          * `RESTRICTED`
          * `NOTKPZ`
          * `UZIPFAIL`
          * `NOWRITEPLUGINS`
          * `NOWRITETEMP`
          * `EMPTYUPLOAD`
          * `SIGNATUREMISMATCH`
          * `UNSIGNED`
          * `UNSIGNEDCONFIRMREQUIRED`
          * `BELOWMINIMUMLEVEL`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        plugins: manage
