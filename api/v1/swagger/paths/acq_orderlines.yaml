/acquisitions/orderlines:
  get:
    x-mojo-to: Acquisitions::OrderManagement::Orderlines#list
    operationId: GetOrderlines
    description: Retrieves the orderlines for the acquisitions module
    tags:
      - GetOrderlines
    produces:
      - application/json
    parameters:
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
