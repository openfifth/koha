---
"/libraries/{library_id}/calendar":
  get:
    x-mojo-to: Libraries::Calendar#list
    operationId: listLibraryCalendar
    tags:
      - libraries
    summary: Get calendar definitions for a library
    description: |
      Returns all closure definitions grouped by type.
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    produces:
      - application/json
    responses:
      "200":
        description: Calendar definitions grouped by type
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Library not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        catalogue: "1"
"/libraries/{library_id}/calendar/copy":
  post:
    x-mojo-to: Libraries::Calendar#copy
    operationId: copyLibraryCalendar
    tags:
      - libraries
    summary: Copy calendar from another library
    description: |
      Copies all closure rules from the source library. Only future
      single closures and exceptions are copied.
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            from_library_id:
              type: string
              description: Branchcode of the source library
          required:
            - from_library_id
          additionalProperties: false
    produces:
      - application/json
    responses:
      "201":
        description: Calendar copied
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `source_not_found`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Library not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
