---
"/libraries/{library_id}/calendar/weekly_closures":
  post:
    x-mojo-to: Libraries::Calendar::WeeklyClosures#add
    operationId: addWeeklyClosure
    tags:
      - libraries
    summary: Add a weekly closure
    parameters:
      - $ref: "../swagger.yaml#/parameters/library_id_pp"
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            weekday:
              type: integer
              description: Day of week (0=Sunday..6=Saturday)
            title:
              type: string
            description:
              type: string
          required:
            - weekday
          additionalProperties: false
    produces:
      - application/json
    responses:
      "201":
        description: Closure created
        schema:
          type: object
          properties:
            library_weekly_closure_id:
              type: integer
              description: Internally assigned identifier
            library_id:
              type: string
              description: Library the closure belongs to
            weekday:
              type: integer
              description: Day of week (0=Sunday..6=Saturday)
            title:
              type: string
            description:
              type: string
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Library not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. Possible `error_code` attribute values:

          * `duplicate`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        tools: edit_calendar
