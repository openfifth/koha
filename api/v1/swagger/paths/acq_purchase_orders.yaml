    description: Retrieves the purchase orders for the acquisitions module
    tags:
      - purchase_orders
    produces:
      - application/json
    parameters:
      - name: x-koha-embed
        in: header
        description: Embed
        required: false
        type: array
        items:
          type: string
          enum:
            - vendor
            - contract
            - billing_library
            - delivery_library
        collectionFormat: csv
