---
/overdues/config:
  get:
    x-mojo-to: Overdues#config
    operationId: getOverduesconfig
    description: This resource returns a list of options needed for the Overdues Vue app
    summary: get the Overdues config
    tags:
      - overdues_config
    produces:
      - application/json
    responses:
      200:
        description: The Overdues config
        schema:
          $ref: "../swagger.yaml#/definitions/overdues_config"
      400:
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      403:
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      500:
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      503:
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        - circulate: overdues_report
