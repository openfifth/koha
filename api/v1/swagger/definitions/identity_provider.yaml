---
type: object
properties:
  identity_provider_id:
    type: integer
    description: Internally assigned identity provider identifier
    readOnly: true
  code:
    description: Identity provider code
    type: string
  description:
    description: User-oriented description for the provider
    type: string
  protocol:
    description: Authentication protocol
    type: string
    enum:
      - OAuth
      - OIDC
      - CAS
      - LDAP
      - SAML2
  config:
    description: Protocol-specific configuration
    type:
      - object
      - "null"
  icon_url:
    description: Icon url for display on login buttons
    type:
      - string
      - "null"
  force_sso_opac:
    description: Force SSO redirect for OPAC users (SAML2/CAS)
    type: boolean
  force_sso_staff:
    description: Force SSO redirect for staff interface users (SAML2/CAS)
    type: boolean
  enabled:
    description: Whether this provider is active
    type: boolean
  domains:
    description: Configured domains for the identity provider
    type:
      - array
      - "null"
additionalProperties: false
required:
  - config
  - code
  - protocol
