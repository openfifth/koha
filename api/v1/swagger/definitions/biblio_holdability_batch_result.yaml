---
type: object
description: |
  One entry of a batch holdability response.

  An entry either reports a verdict or reports that an id could not be resolved.
  A verdict carries `available`, `needs_confirmation`, `blockers`,
  `confirmations` and `warnings`. An unresolved id carries `error` and
  `error_code` instead, and no verdict fields. Read `error_code` first.
properties:
  patron_id:
    description: Internal patron identifier that this entry answers for
    type: integer
  item_id:
    description: Internal item identifier that this entry answers for. Absent for a record-level verdict
    type:
      - integer
      - "null"
  available:
    description: Whether the patron can place the hold. False when the blockers list is not empty
    type:
      - boolean
      - "null"
  needs_confirmation:
    description: Whether the hold needs confirmation first
    type:
      - boolean
      - "null"
  blockers:
    description: Conditions that prevent the hold
    type:
      - array
      - "null"
    items:
      $ref: availability_reason.yaml
  confirmations:
    description: Conditions that need confirmation before the hold can be placed
    type:
      - array
      - "null"
    items:
      $ref: availability_reason.yaml
  warnings:
    description: Conditions that do not prevent the hold
    type:
      - array
      - "null"
    items:
      $ref: availability_reason.yaml
  error:
    description: Why this entry has no verdict. Present only with `error_code`
    type:
      - string
      - "null"
  error_code:
    description: |
      Machine-readable reason this entry has no verdict.

      * `patron_not_found` - no patron holds the given `patron_id`
      * `item_not_found` - no item of this record holds the given `item_id`
    type:
      - string
      - "null"
    enum:
      - patron_not_found
      - item_not_found
additionalProperties: false
required:
  - patron_id
