---
type: object
properties:
  erm_counter_log_id:
    type: integer
    description: internally assigned counter_log identifier
    readOnly: true
  counter_files_id:
    description: counter_files_id of the counter_log
    type:
    - integer
    - "null"
  patron_id:
    description: patron_id of the counter log
    type:
    - integer
    - "null"
  importdate:
    type: string
    format: date-time
    description: Timestamp for the date of upload
  filename:
    description: filename of the counter_file
    type: 
    - string
    - "null"
  logdetails:
    description: logdetails of the counter_log
    type: 
    - string
    - "null"
  usage_data_provider_id:
    description: usage_data_provider_id of the counter_log
    type:
    - integer
    - "null"
  background_job_id:
    description: internally assigned identifier of the background job that created the counter log
    type:
    - integer
    - "null"
  report_type:
    description: COUNTER report type of the harvested report
    type:
    - string
    - "null"
  report_year:
    description: year of the month covered by the harvested report
    type:
    - integer
    - "null"
  report_month:
    description: month covered by the harvested report
    type:
    - integer
    - "null"
  status:
    description: outcome of the harvest or import
    type: string
    enum:
      - success
      - no_usage
      - no_data
      - retry
      - error
  background_job:
    description: background job that created the counter log
    type:
    - object
    - "null"
  patron:
    description: patron object for the importer
    type:
    - object
    - "null"

additionalProperties: false
required:
  - filename
  - patron_id
  - counter_files_id
