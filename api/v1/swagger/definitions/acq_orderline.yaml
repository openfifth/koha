---
type: object
properties:
  orderline_id:
    type: number
    description: Unique identifier for the orderline
    readOnly: true
  biblionumber:
    type:
      - number
      - "null"
    description: Foreign key referencing the biblio table
  deleted_biblionumber:
    type:
      - number
      - "null"
    description: Foreign key referencing the deletedbiblio table
  subscriptionid:
    type:
      - number
      - "null"
    description: Foreign key referencing the subscription table
  purchase_order_id:
    type:
      - number
      - "null"
    description: Foreign key referencing the acq_purchase_orders table
  created_by:
    type:
      - number
      - "null"
    description: Foreign key referencing the borrowers table
  created_date:
    type: string
    format: date-time
    readOnly: true
    description: Date the orderline was created
  modified_date:
    type: string
    format: date-time
    readOnly: true
    description: Date the orderline was last updated
  ordered_date:
    type:
     - string
     - "null"
    format: date-time
    description: Date the orderline was ordered
  status:
    type:
     - string
     - "null"
    enum:
      - draft
      - new
      - ordered
      - continuing
      - complete
      - partial
      - unsubscribed
      - cancelled
      - null
    description: Status of the orderline
  payment_status:
    type:
     - string
     - "null"
    enum:
      - pending
      - partial
      - paid
      - unpaid
      - cancelled
      - null
    description: Payment status of the orderline
  is_continuous:
    type: boolean
    description: Whether the orderline is continuous
  renewal_required:
    type: boolean
    description: Whether the orderline requires renewal
  review_interval:
    type:
      - number
      - "null"
    description: Interval for reviewing the orderline
  last_review_date:
    type:
     - string
     - "null"
    format: date
    description: Date the orderline was last reviewed
  planned_cancellation_date:
    type:
      - string
      - "null"
    format: date
    description: Date the subscription is planned to be cancelled
  acquisition_method:
    type:
     - string
     - "null"
    description: Method of acquisition for the orderline
  create_items:
    type:
     - string
     - "null"
    enum:
      - ordering
      - receiving
      - cataloging
      - null
    description: Point at which items are created for the orderline
  managing_branch:
    type:
      - string
      - "null"
    description: Branch responsible for managing the orderline
  vendor_id:
    type:
      - number
      - "null"
    description: Foreign key referencing the vendors table
  quantity_ordered:
    type:
      - number
      - "null"
    description: Quantity ordered for the orderline
  uncertain_price:
    type: boolean
    description: Whether the price is uncertain
  vendor_price_currency:
    type:
     - string
     - "null"
    description: Currency used for the vendor price
  vendor_price:
    type:
     - number
     - "null"
    description: Price charged by the vendor
  discount_percentage:
    type:
     - number
     - "null"
    description: Discount percentage applied to the orderline
  discount_amount_oc:
    type:
     - number
     - "null"
    description: Discount amount in the original currency
  replacement_price:
    type:
     - number
     - "null"
    description: Replacement cost for the orderline
  calculated_amount_oc:
    type:
     - number
     - "null"
    description: Calculated amount in the original currency
  internal_note:
    type:
     - string
     - "null"
    description: Internal note for the orderline
  receiving_note:
    type:
     - string
     - "null"
    description: Receiving note for the orderline
  vendor_note:
    type:
     - string
     - "null"
    description: Vendor note for the orderline
  urgent_order:
    type: boolean
    description: Whether the orderline is urgent
  statistic1:
    type:
     - string
     - "null"
    description: First statistical field for the orderline
  statistic2:
    type:
     - string
     - "null"
    description: Second statistical field for the orderline
  estimated_delivery_date:
    type:
     - string
     - "null"
    format: date
  edi_line_item_id:
    type:
     - string
     - "null"
  edi_suppliers_reference_number:
    type:
     - string
     - "null"
  edi_suppliers_reference_qualifier:
    type:
     - string
     - "null"
  edi_suppliers_report:
    type:
     - string
     - "null"
  fund_distributions:
    description: Fund distributions for the orderline
    type:
      - array
    items:
      $ref: acq_orderline_fund_distribution.yaml
  extended_attributes:
    description: Related additional field values
    type:
      - array
    items:
      $ref: extended_attribute_value.yaml
  _strings:
    type:
      - object
      - "null"
  vendor:
    description: Information about the vendor
    type:
      - object
      - "null"
  biblio:
    description: Information about the biblio attached to the orderline
    type:
      - object
      - "null"
  managing_library:
    description: Information about the managing library for the orderline
    type:
      - object
      - "null"
  managed_by:
    description: Managers for the orderline
    type:
      - array
    items:
      $ref: acq_orderline_manager.yaml
  patrons_to_notify:
    description: Users for the orderline who need notifying of any changes
    type:
      - array
    items:
      $ref: acq_orderline_user.yaml
  items:
    description: Items linked to the orderline
    type:
      - array
    items:
      $ref: item.yaml
additionalProperties: false
required:
  - orderline_id
  - quantity_ordered
