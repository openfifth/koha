---
type: object
required:
  - itemnumber
  - biblionumber
  - biblioitemnumber
  - notforloan
  - damaged
  - itemlost
  - withdrawn
  - timestamp
properties:
  itemnumber:
    type: integer
    description: Primary key and unique identifier added by Koha
  biblionumber:
    type: integer
    description: Foreign key from biblio table used to link this item to the right bib record
  biblioitemnumber:
    type: integer
    description: Foreign key from the biblioitems table to link to item to additional information
  barcode:
    type: string
    x-nullable: true
    description: Item barcode (MARC21 952$p)
  bookable:
    type: boolean
    x-nullable: true
    description: Nullable boolean value defining whether this this item is available for bookings or not
  dateaccessioned:
    type: string
    format: date
    x-nullable: true
    description: Date the item was acquired or added to Koha (MARC21 952$d)
  booksellerid:
    type: string
    x-nullable: true
    description: Where the item was purchased (MARC21 952$e)
  homebranch:
    type: string
    x-nullable: true
    description: Foreign key from the branches table for the library that owns this item (MARC21 952$a)
  price:
    type: number
    format: float
    x-nullable: true
    description: Purchase price (MARC21 952$g)
  replacementprice:
    type: number
    format: float
    x-nullable: true
    description: Cost the library charges to replace the item if it has been marked lost (MARC21 952$v)
  replacementpricedate:
    type: string
    format: date
    x-nullable: true
    description: The date the price is effective from (MARC21 952$w)
  datelastborrowed:
    type: string
    format: date
    x-nullable: true
    description: The date the item was last checked out
  datelastseen:
    type: string
    format: date-time
    x-nullable: true
    description: The date the item was last seen (usually the last time the barcode was scanned or inventory was done)
  stack:
    type: boolean
    x-nullable: true
    description: Stack flag
  notforloan:
    type: boolean
    description: Authorized value defining why this item is not for loan (MARC21 952$7)
  damaged:
    type: boolean
    description: Authorized value defining this item as damaged (MARC21 952$4)
  damaged_on:
    type: string
    format: date-time
    x-nullable: true
    description: The date and time an item was last marked as damaged, NULL if not damaged
  itemlost:
    type: boolean
    description: Authorized value defining this item as lost (MARC21 952$1)
  itemlost_on:
    type: string
    format: date-time
    x-nullable: true
    description: The date and time an item was last marked as lost, NULL if not lost
  withdrawn:
    type: boolean
    description: Authorized value defining this item as withdrawn (MARC21 952$0)
  withdrawn_on:
    type: string
    format: date-time
    x-nullable: true
    description: The date and time an item was last marked as withdrawn, NULL if not withdrawn
  itemcallnumber:
    type: string
    x-nullable: true
    description: Call number for this item (MARC21 952$o)
  coded_location_qualifier:
    type: string
    x-nullable: true
    description: Coded location qualifier(MARC21 952$f)
  issues:
    type: integer
    x-nullable: true
    description: Number of times this item has been checked out
  renewals:
    type: integer
    x-nullable: true
    description: Number of times this item has been renewed
  localuse:
    type: integer
    x-nullable: true
    description: Number of times this item has been recorded as localuse
  reserves:
    type: integer
    x-nullable: true
    description: Number of times this item has been placed on hold/reserved
  restricted:
    type: boolean
    x-nullable: true
    description: Authorized value defining use restrictions for this item (MARC21 952$5)
  itemnotes:
    type: string
    x-nullable: true
    description: Public notes on this item (MARC21 952$z)
  itemnotes_nonpublic:
    type: string
    x-nullable: true
    description: Non-public notes on this item (MARC21 952$x)
  holdingbranch:
    type: string
    x-nullable: true
    description: Foreign key from the branches table for the library that is currently in possession item (MARC21 952$b)
  timestamp:
    type: string
    format: date-time
    description: Date and time this item was last altered
  deleted_on:
    type: string
    format: date-time
    x-nullable: true
    description: Date/time of deletion
  location:
    type: string
    x-nullable: true
    description: Authorized value for the shelving location for this item (MARC21 952$c)
  permanent_location:
    type: string
    x-nullable: true
    description: Linked to the CART and PROC temporary locations feature, stores the permanent shelving location
  onloan:
    type: string
    format: date
    x-nullable: true
    description: Defines if item is checked out (NULL for not checked out, and due date for checked out)
  cn_source:
    type: string
    x-nullable: true
    description: Classification source used on this item (MARC21 952$2)
  cn_sort:
    type: string
    x-nullable: true
    description: Normalized form of the call number (MARC21 952$o) used for sorting
  ccode:
    type: string
    x-nullable: true
    description: Authorized value for the collection code associated with this item (MARC21 952$8)
  materials:
    type: string
    x-nullable: true
    description: Materials specified (MARC21 952$3)
  uri:
    type: string
    x-nullable: true
    description: URL for the item (MARC21 952$u)
  itype:
    type: string
    x-nullable: true
    description: Foreign key from the itemtypes table defining the type for this item (MARC21 952$y)
  more_subfields_xml:
    type: string
    x-nullable: true
    description: Additional 952 subfields in XML format
  enumchron:
    type: string
    x-nullable: true
    description: Serial enumeration/chronology for the item (MARC21 952$h)
  copynumber:
    type: string
    x-nullable: true
    description: Copy number (MARC21 952$t)
  stocknumber:
    type: string
    x-nullable: true
    description: Inventory number (MARC21 952$i)
  new_status:
    type: string
    x-nullable: true
    description: "'new' value, you can put whatever free-text information. This field is intended to be managed by the automatic_item_modification_by_age cronjob."
  exclude_from_local_holds_priority:
    type: boolean
    x-nullable: true
    description: Exclude this item from local holds priority
additionalProperties: true