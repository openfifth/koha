---
type: object
properties:
  identity_provider_hostname_id:
    type: integer
    description: Internally assigned identifier for this hostname-provider association
    readOnly: true
  hostname_id:
    description: Identifier of the associated hostname record
    type: integer
  hostname:
    description: Server hostname string (embedded from the hostnames table, read-only)
    type: string
    readOnly: true
  identity_provider_id:
    description: Identity provider associated with this hostname
    type: integer
  is_enabled:
    description: Whether this hostname is active for this provider
    type: boolean
  force_sso_opac:
    description: >
      Force SSO redirect for OPAC users visiting this hostname. Only one
      identity provider should have this enabled per hostname.
    type: boolean
  force_sso_staff:
    description: >
      Force SSO redirect for staff interface users visiting this hostname.
      Only one identity provider should have this enabled per hostname.
    type: boolean
additionalProperties: false
required:
  - hostname
