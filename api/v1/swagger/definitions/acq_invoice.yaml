---
type: object
properties:
  invoice_id:
    type: number
    description: Unique identifier for the invoice
    readOnly: true
  vendor_invoice_number:
    type:
      - string
      - "null"
    description: Vendor-issued invoice number
  vendor_id:
    type:
      - number
      - "null"
    description: Foreign key referencing the aqbooksellers table
  received_date:
    type:
      - string
      - "null"
    format: date
    description: Date the invoice was received
  billed_date:
    type:
      - string
      - "null"
    format: date
    description: Date the invoice was billed
  created_date:
    type: string
    format: date-time
    readOnly: true
    description: Date the invoice was created
  modified_date:
    type: string
    format: date-time
    readOnly: true
    description: Date the invoice was last updated
  closed_date:
    type:
      - string
      - "null"
    format: date-time
    description: Date the invoice was closed
  status:
    type: boolean
    description: Status of the invoice
  approved:
    type:
      - boolean
      - "null"
    description: Whether the invoice has been approved
  approved_by:
    type:
      - number
      - "null"
    description: Foreign key referencing the borrowers table
  currency:
    type:
      - string
      - "null"
    description: Currency of the invoice
  invoice_total_amount:
    type:
      - number
      - "null"
    description: Total amount of the invoice
  payment_due:
    type:
      - string
      - "null"
    format: date
    description: Date payment is due
  external_financial_system:
    type:
      - boolean
      - "null"
    description: Whether this is managed by an external financial system
  external_invoice_number:
    type:
      - string
      - "null"
    description: Invoice number in the external financial system
  external_accounting_id:
    type:
      - string
      - "null"
    description: Accounting id in the external financial system
  exported_date:
    type:
      - string
      - "null"
    format: date-time
    description: Date the invoice was exported to an external system
  edifact_message_id:
    type:
      - number
      - "null"
    description: Foreign key referencing the edifact_messages table
  invoicelines:
    description: Invoice lines for the invoice
    type:
      - array
    items:
      $ref: acq_invoiceline.yaml
additionalProperties: false
